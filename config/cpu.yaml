experiment_name: "bi_lgmm_audiocaps_cpu"
seed: 42
device: "cpu"

data:
  mode: "cached_numpy"
  cache_dir: "./data/audiocaps_cached"
  train_size: 8000
  val_size: 1000
  test_size: 1000
  audio_in_dim: 768       
  text_in_dim: 768        
  shared_dim: 512         
  max_audio_frames: 64    
  max_text_tokens: 30     

model:
  type: "bi_lgmm"         
  tau_w: 0.25             
  lse_lambda: 10.0        

loss:
  tau: 0.07               
  beta: 0.3               

training:
  epochs: 30
  batch_size: 128
  lr: 0.001               
  num_workers: 2
  save_dir: "./checkpoints"

integrity:
  strict_mode: true
  norm_tol: 1.0e-5