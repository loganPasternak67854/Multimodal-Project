experiment_name: "bi_lgmm_smoke_test"
seed: 42
device: "cpu"

data:
  mode: "synthetic"
  train_size: 256
  val_size: 64
  test_size: 64
  audio_in_dim: 768
  text_in_dim: 768
  shared_dim: 512
  max_audio_frames: 32
  max_text_tokens: 20

model:
  type: "bi_lgmm"
  tau_w: 0.25
  lse_lambda: 10.0

loss:
  tau: 0.07
  beta: 0.3

training:
  epochs: 2
  batch_size: 32
  lr: 0.001
  num_workers: 0
  save_dir: "./checkpoints_smoke"

integrity:
  strict_mode: true
  norm_tol: 1.0e-5